<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>pi RPC bubbles — headful streaming chat</title>
  <style>
    body { margin: 0; background: #11121a; color: #c0caf5; font-family: ui-sans-serif, system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
    #bar { padding: 8px 14px; background: #0e0f17; border-bottom: 1px solid #1f2030; font-size: 13px; display: flex; gap: 10px; align-items: center; }
    #bar b { color: #7aa2f7; } #state { color: #565f89; font-size: 11px; }
    #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .bubble { max-width: 78%; padding: 9px 13px; border-radius: 11px; white-space: pre-wrap; font-size: 14px; line-height: 1.5; }
    .user { align-self: flex-end; background: #3d59a1; color: #fff; }
    .assistant { align-self: flex-start; background: #1c1d2b; }
    .tool { align-self: flex-start; font-size: 11px; color: #e0af68; font-family: ui-monospace, monospace; }
    .cursor::after { content: '▋'; color: #7aa2f7; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    #composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #1f2030; background: #0e0f17; }
    input { flex: 1; background: #1a1b26; color: #c0caf5; border: 1px solid #2a2b3d; border-radius: 9px; padding: 10px; font-size: 14px; }
    button { background: #7aa2f7; color: #11121a; border: 0; border-radius: 9px; padding: 0 18px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div id="bar"><b>pi RPC</b> · headful thread <span id="sid"></span> · <span id="state">connecting…</span></div>
  <div id="log"></div>
  <div id="composer">
    <input id="input" placeholder="Message the live pi agent (streams over RPC)…" autofocus />
    <button id="send">Send</button>
  </div>
  <script>
    const p = new URLSearchParams(location.search)
    const session = p.get('session')
    document.getElementById('sid').textContent = (session||'').slice(0,8)
    const log = document.getElementById('log'), input = document.getElementById('input')
    let ws, current = null  // the streaming assistant bubble

    function bubble(cls, text='') { const d = document.createElement('div'); d.className = 'bubble ' + cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d }

    function connect() {
      ws = new WebSocket(`ws://${location.host}/rpc?session=${encodeURIComponent(session)}`)
      ws.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data) } catch { return }
        if (m.ok && m.state) { document.getElementById('state').textContent = m.state.idle ? 'idle · ' + m.state.config.model : 'busy'; return }
        if (m.event === 'text_delta') {
          if (!current) { current = bubble('assistant cursor') }
          current.textContent += m.delta; log.scrollTop = log.scrollHeight
        } else if (m.event === 'tool_execution_start') { bubble('tool', '▶ ' + m.toolName)
        } else if (m.event === 'tool_execution_end') { bubble('tool', '■ ' + m.toolName)
        } else if (m.event === 'agent_end') { if (current) current.classList.remove('cursor'); current = null; document.getElementById('state').textContent = 'idle' }
      }
      ws.onclose = () => document.getElementById('state').textContent = 'closed'
    }
    function send() {
      const text = input.value.trim(); if (!text || ws.readyState !== 1) return
      bubble('user', text); input.value = ''; current = null
      ws.send(JSON.stringify({ message: text }))
    }
    document.getElementById('send').onclick = send
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send() })
    connect()
  </script>
</body>
</html>
